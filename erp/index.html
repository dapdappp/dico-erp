<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DICO ERP - Enterprise Resource Planning</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <style>
        /* Login Page */
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b1a3a 0%, #2f8fff 100%);
        }
        .login-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 8px 30px rgba(0,0,0,0.12);
        }
        .login-box h1 {
            text-align: center;
            margin-bottom: 8px;
            font-size: 28px;
            color: #0b1a3a;
        }
        .login-box p {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .login-form label {
            font-size: 13px;
            font-weight: 500;
            color: #1c2434;
            margin-bottom: 4px;
        }
        .login-form input {
            padding: 10px 14px;
            border: 1px solid #e6ebf2;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }
        .login-form input:focus {
            outline: none;
            border-color: #2f8fff;
            box-shadow: 0 0 0 3px rgba(47, 143, 255, 0.1);
        }
        .login-form button {
            padding: 10px 16px;
            background: #2f8fff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 200ms, box-shadow 200ms;
        }
        .login-form button:hover {
            background: #1c6fee;
            box-shadow: 0 4px 12px rgba(47, 143, 255, 0.35);
        }
        .login-error {
            color: #e9475a;
            font-size: 13px;
            text-align: center;
            margin-top: 12px;
            display: none;
        }

        /* Main Layout (After Login) */
        .erp-layout {
            display: none;
            height: 100vh;
            flex-direction: row;
        }
        .erp-layout.active {
            display: flex;
        }
        .sidebar-wrapper {
            width: 280px;
            background: #0b1a3a;
            color: white;
            overflow-y: auto;
            border-right: 1px solid #142653;
        }
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            height: 56px;
            background: white;
            border-bottom: 1px solid #e6ebf2;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
        }
        .topbar-user {
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
        }
        .topbar-user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #2f8fff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
        }
        .topbar-user-name {
            font-size: 13px;
            color: #1c2434;
            font-weight: 500;
        }
        .content-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            background: #f2f5fa;
        }
        #modal-root {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
            pointer-events: none;
        }
        #modal-root:not(:empty) {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <!-- LOGIN PAGE -->
    <div id="loginPage" class="login-container">
        <div class="login-box">
            <h1>DICO ERP</h1>
            <p>Sistem Manajemen Terintegrasi</p>
            <form id="loginForm" class="login-form" onsubmit="handleLogin(event)">
                <div>
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Contoh: admin@dico.local" required>
                </div>
                <div>
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Masukkan password" required>
                </div>
                <button type="submit">Masuk</button>
                <div id="loginError" class="login-error"></div>
            </form>
        </div>
    </div>

    <!-- MAIN ERP LAYOUT -->
    <div id="erpLayout" class="erp-layout">
        <div class="sidebar-wrapper">
            <div id="sidebar"></div>
        </div>
        <div class="main-content">
            <div class="topbar">
                <div>DICO ERP</div>
                <div class="topbar-user">
                    <div class="topbar-user-avatar" id="userAvatar">A</div>
                    <div class="topbar-user-name" id="userName">Admin</div>
                </div>
            </div>
            <div id="modal-root"></div>
            <div class="content-area" id="contentArea">
                <!-- Dynamic content rendered here -->
            </div>
        </div>
    </div>

    <script src="core/util.js"></script>
    <script src="core/auth.js"></script>
    <script src="core/ui.js"></script>
    <script src="core/api.js"></script>
    <script src="core/nav.js"></script>
    <script src="core/router.js"></script>
</body>
</html>
